          // 绑定所有空白单元格的点击交互
          this.bindCellInteractions();
          this.updateProgressDisplay();
          if (this.updateScale) this.updateScale();
        },

        buildInfoBarHtml() {
          const showName = document.getElementById("showName").checked;
          const showClass = document.getElementById("showClass").checked;
          const showDate = document.getElementById("showDate").checked;
          const showTime = document.getElementById("showTime").checked;
          const showScore = document.getElementById("showScore").checked;

          const studentName = document.getElementById("inputStudentName").value || "";
          const studentClass = document.getElementById("inputStudentClass").value || "";

          if (!showName && !showClass && !showDate && !showTime && !showScore) {
            return "";
          }

          const items = [];
          if (showClass) {
            items.push(
              `<div class="info-item"><span>班级：</span><span class="info-line">${this.escapeHtml(studentClass)}</span></div>`
            );
          }
          if (showName) {
            items.push(
              `<div class="info-item"><span>姓名：</span><span class="info-line">${this.escapeHtml(studentName)}</span></div>`
            );
          }
          if (showDate) {
            const todayStr = new Date().toISOString().split("T")[0];
            items.push(
              `<div class="info-item"><span>日期：</span><span class="info-line wide">${todayStr}</span></div>`
            );
          }
          if (showTime) {
            const timeText = this.examState.status === "submitted"
              ? `${Math.floor(this.examState.elapsedSeconds / 60)}分${this.examState.elapsedSeconds % 60}秒`
              : "";
            items.push(
              `<div class="info-item"><span>用时：</span><span class="info-line wide">${timeText}</span></div>`
            );
          }
          if (showScore) {
            const scoreStampHtml = this.examState.status === "submitted" && this.examState.currentResult
              ? `<span class="score-stamp">💯 ${this.examState.currentResult.score}分</span>`
              : "";
            items.push(
              `<div class="info-item"><span>得分：</span><span class="info-line">${scoreStampHtml}</span></div>`
            );
          }

          return `<div class="paper-info-bar">${items.join("")}</div>`;
        },

        buildSudokuCardHtml(item, boardSize, cellFontSize, symbolMap) {
          const { id, puzzle, solution, cluesCount } = item;
          const isSubmitted = this.examState.status === "submitted";

          let cellsHtml = "";
          for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 4; c++) {
              const clueVal = puzzle[r][c];
              const ansVal = solution[r][c];
              const cellKey = `${id}_${r}_${c}`;
              const userVal = this.examState.userAnswers[cellKey];

              if (clueVal !== 0) {
                // 题目原有已知数
                const sym = symbolMap[clueVal];
                cellsHtml += `<div class="sudoku-cell filled-clue" style="font-size: ${cellFontSize};">${sym}</div>`;
              } else {
                // 空白答题格
                let cellClass = "sudoku-cell empty";
                let innerContent = "";

                if (isSubmitted) {
                  // 已交卷评分模式
                  if (userVal === ansVal) {
                    cellClass += " graded-correct";
                    innerContent = `<span class="user-val">${symbolMap[userVal]}</span>`;
                  } else if (userVal !== undefined && userVal !== null) {
                    cellClass += " graded-wrong";
                    innerContent = `
                      <span class="user-val">${symbolMap[userVal]}</span>
                      <span class="correct-hint">${symbolMap[ansVal]}</span>
                    `;
                  } else {
                    cellClass += " graded-missed";
                    innerContent = `<span class="correct-hint">${symbolMap[ansVal]}</span>`;
                  }
                } else {
                  // 做题模式
                  if (userVal !== undefined && userVal !== null) {
                    innerContent = `<span class="user-val">${symbolMap[userVal]}</span>`;
                  }
                  innerContent += `<span class="answer-preview">${symbolMap[ansVal]}</span>`;
                }

                cellsHtml += `
                  <div
                    class="${cellClass}"
                    data-puzzle-id="${id}"
                    data-row="${r}"
                    data-col="${c}"
                    style="font-size: ${cellFontSize};"
                  >
                    ${innerContent}
                  </div>
                `;
              }
            }
          }

          return `
            <div class="sudoku-card" id="card_puzzle_${id}">
              <div class="sudoku-card-header" style="max-width: ${boardSize};">
                <span class="sudoku-card-title">第 ${id} 题</span>
                <span class="sudoku-difficulty-tag">给${cluesCount}数</span>
              </div>
              <div class="sudoku-board" style="width: ${boardSize}; height: ${boardSize};">
                ${cellsHtml}
              </div>
            </div>
          `;
        },

        buildAnswerCardHtml(item, boardSize, cellFontSize, symbolMap) {
          const { id, puzzle, solution, cluesCount } = item;
          let cellsHtml = "";
          for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 4; c++) {
              const clueVal = puzzle[r][c];
              const ansVal = solution[r][c];
              const sym = symbolMap[ansVal];

              if (clueVal !== 0) {
                // 题目原有已知数：保持已知数样式，与试卷已知数完全对应
                cellsHtml += `<div class="sudoku-cell filled-clue" style="font-size: ${cellFontSize};">${sym}</div>`;
              } else {
                // 挖空格填入的标准答案：突出醒目显示
                cellsHtml += `<div class="sudoku-cell answer-val-cell" style="font-size: ${cellFontSize};">${sym}</div>`;
              }
            }
          }

          return `
            <div class="sudoku-card" id="card_answer_${id}">
              <div class="sudoku-card-header" style="max-width: ${boardSize};">
                <span class="sudoku-card-title">第 ${id} 题</span>
                <span class="sudoku-difficulty-tag answer-tag">答案 · 给${cluesCount}数</span>
              </div>
              <div class="sudoku-board" style="width: ${boardSize}; height: ${boardSize};">
                ${cellsHtml}
              </div>
            </div>
          `;
        },

        // 绑定空格点击弹出输入面板
        bindCellInteractions() {
          const emptyCells = document.querySelectorAll(".sudoku-cell.empty");
          emptyCells.forEach((cell) => {
            cell.addEventListener("click", (e) => {
              e.stopPropagation();
              const puzzleId = parseInt(cell.dataset.puzzleId, 10);
              const r = parseInt(cell.dataset.row, 10);
              const c = parseInt(cell.dataset.col, 10);
              this.openKeypad(cell, puzzleId, r, c);
            });
          });
        },

        // 打开浮动面板
        openKeypad(cellElem, puzzleId, r, c) {
          // 清除先前激活格高亮
          if (this.activeCell?.cellElem) {
            this.activeCell.cellElem.classList.remove("is-active");
          }

          this.activeCell = { puzzleId, r, c, cellElem };
          cellElem.classList.add("is-active");

          const popover = document.getElementById("keypadPopover");
          const symbolType = document.getElementById("symbolType").value;
          const symbolMap = SYMBOL_SETS[symbolType] || SYMBOL_SETS.numbers;

          // 动态渲染 1~4 选项；若已有已填内容才提供删除按钮
          let buttonsHtml = "";
          for (let val = 1; val <= 4; val++) {
            buttonsHtml += `
              <button class="keypad-btn" data-val="${val}">
                ${symbolMap[val]}
              </button>
            `;
          }

          const cellKey = `${puzzleId}_${r}_${c}`;
          const hasUserVal =
            this.examState.userAnswers[cellKey] !== undefined &&
            this.examState.userAnswers[cellKey] !== null;
          if (hasUserVal) {
            buttonsHtml += `
              <button class="keypad-btn btn-erase" data-val="0" title="清空">
                ⌫
              </button>
            `;
          }
          popover.innerHTML = buttonsHtml;

          // 绑定按键点击事件
          const btns = popover.querySelectorAll(".keypad-btn");
          btns.forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              const val = parseInt(btn.dataset.val, 10);
              this.fillCurrentCell(val);
            });
          });

          // 定位 Popover
          popover.classList.add("active");
          const rect = cellElem.getBoundingClientRect();
          const popoverWidth = hasUserVal ? 256 : 210;
          const popoverHeight = 56;

          let left = rect.left + rect.width / 2;
          let top = rect.top;

          // 边界防溢出
          if (left - popoverWidth / 2 < 10) {
            left = popoverWidth / 2 + 10;
          } else if (left + popoverWidth / 2 > window.innerWidth - 10) {
            left = window.innerWidth - popoverWidth / 2 - 10;
          }

          // 若上方空间不够，则翻转到底部
          if (top - popoverHeight < 60) {
            popover.classList.add("flip-bottom");
            top = rect.bottom;
          } else {
            popover.classList.remove("flip-bottom");
          }

          popover.style.left = `${left}px`;
          popover.style.top = `${top}px`;
        },

        closeKeypad() {
          const popover = document.getElementById("keypadPopover");
          if (popover) popover.classList.remove("active");
          if (this.activeCell?.cellElem) {
            this.activeCell.cellElem.classList.remove("is-active");
          }
          this.activeCell = null;
        },

        // 填入数值后关闭弹窗并取消选中状态，不自动跳转下一格
        fillCurrentCell(val) {
          if (!this.activeCell) return;
          const { puzzleId, r, c, cellElem } = this.activeCell;
          const cellKey = `${puzzleId}_${r}_${c}`;

          const symbolType = document.getElementById("symbolType").value;
          const symbolMap = SYMBOL_SETS[symbolType] || SYMBOL_SETS.numbers;

          if (val === 0) {
            delete this.examState.userAnswers[cellKey];
            const userValSpan = cellElem.querySelector(".user-val");
            if (userValSpan) userValSpan.remove();
          } else {
            this.examState.userAnswers[cellKey] = val;
            let userValSpan = cellElem.querySelector(".user-val");
            if (!userValSpan) {
              userValSpan = document.createElement("span");
              userValSpan.className = "user-val";
              cellElem.appendChild(userValSpan);
            }
            userValSpan.textContent = symbolMap[val];
          }

          this.updateProgressDisplay();

          // 填了之后弹窗消失，取消选中状态，不自动选中下一个单元格
          this.closeKeypad();
        },

        // 自动聚焦下一个空格
        focusNextEmptyCell(currentPuzzleId, currentR, currentC) {
          const allEmptyInPuzzle = Array.from(
            document.querySelectorAll(`.sudoku-cell.empty[data-puzzle-id="${currentPuzzleId}"]`)
          );

          const currentIndex = allEmptyInPuzzle.findIndex(
            (el) =>
              parseInt(el.dataset.row, 10) === currentR &&
              parseInt(el.dataset.col, 10) === currentC
          );

          // 寻找下一个未填写的空格
          let nextCell = null;
          for (let i = currentIndex + 1; i < allEmptyInPuzzle.length; i++) {
            const pId = allEmptyInPuzzle[i].dataset.puzzleId;
            const r = allEmptyInPuzzle[i].dataset.row;
            const c = allEmptyInPuzzle[i].dataset.col;
            if (!this.examState.userAnswers[`${pId}_${r}_${c}`]) {
              nextCell = allEmptyInPuzzle[i];
              break;
            }
          }

          if (nextCell) {
            const nPuzzleId = parseInt(nextCell.dataset.puzzleId, 10);
            const nR = parseInt(nextCell.dataset.row, 10);
            const nC = parseInt(nextCell.dataset.col, 10);
            this.openKeypad(nextCell, nPuzzleId, nR, nC);
          } else {
            this.closeKeypad();
          }
        },

        // 绑定键盘按键事件 (1-4, ABCD, Backspace, 方向键)
        bindKeypadEvents() {
          window.addEventListener("keydown", (e) => {
            if (!this.activeCell) return;
            const key = e.key;

            if (["1", "2", "3", "4"].includes(key)) {
              e.preventDefault();
              this.fillCurrentCell(parseInt(key, 10));
            } else if (["a", "b", "c", "d"].includes(key.toLowerCase())) {
              e.preventDefault();
              const map = { a: 1, b: 2, c: 3, d: 4 };
              this.fillCurrentCell(map[key.toLowerCase()]);
            } else if (key === "Backspace" || key === "Delete") {
              e.preventDefault();
              this.fillCurrentCell(0);
            }
          });
        },

        // 交卷并按 100 分制评分
        submitExam() {
          const filledCount = Object.keys(this.examState.userAnswers).length;
          const totalHoles = this.examState.totalHoles;

          if (filledCount < totalHoles) {
            const unDone = totalHoles - filledCount;
            if (!confirm(`还有 ${unDone} 个空格未填写，确定现在交卷评分吗？`)) {
              return;
            }
          }

          // 停止计时器
          if (this.examState.timerInterval) {
            clearInterval(this.examState.timerInterval);
          }
          this.examState.status = "submitted";
          document.getElementById("examStatusText").textContent = "✅ 已交卷·已批改";

          // 评分统计
          let correctHoles = 0;
          let wrongHoles = 0;
          let correctPuzzles = 0;

          this.flatPuzzles.forEach((item) => {
            const { id, puzzle, solution } = item;
            let puzzleAllCorrect = true;

            for (let r = 0; r < 4; r++) {
              for (let c = 0; c < 4; c++) {
                if (puzzle[r][c] === 0) {
                  const key = `${id}_${r}_${c}`;
                  const userVal = this.examState.userAnswers[key];
                  const trueVal = solution[r][c];

                  if (userVal === trueVal) {
                    correctHoles++;
                  } else {
                    wrongHoles++;
                    puzzleAllCorrect = false;
                  }
                }
              }
            }

            if (puzzleAllCorrect) {
              correctPuzzles++;
            }
          });

          // 100 分制计算
          const score = totalHoles > 0
            ? Math.round((correctHoles / totalHoles) * 100)
            : 100;

          const result = {
            score,
            timeSpent: this.examState.elapsedSeconds,
            totalPuzzles: this.flatPuzzles.length,
            correctPuzzles,
            totalHoles,
            correctHoles,
            wrongHoles,
            difficulty: document.getElementById("difficulty").value,
            symbolType: document.getElementById("symbolType").value,
            studentName: document.getElementById("inputStudentName").value || "",
            studentClass: document.getElementById("inputStudentClass").value || "",
            pagesCount: parseInt(document.getElementById("pagesCount").value, 10),
            rowsPerPage: parseInt(document.getElementById("rowsPerPage").value, 10),
            createdAt: new Date().toISOString(),
          };

          this.examState.currentResult = result;

          // 刷新卷面展示批改标记与考务栏得分
          this.closeKeypad();
          this.renderPages();

          // 弹出成绩单
          this.openScoreModal(result);

          // 保存到后端和本地
          this.saveExamRecord(result);
        },

        // 保存做题记录 (后端 D1 + 本地 LocalStorage)
        async saveExamRecord(result) {
          const clientUuid = getClientUuid();
          const recordPayload = {
            ...result,
            clientUuid,
            detailJson: {
              puzzles: this.flatPuzzles,
              userAnswers: this.examState.userAnswers,
            },
          };

          // 本地缓存
          try {
            const localList = JSON.parse(localStorage.getItem("shudu_local_records") || "[]");
            localList.unshift({
              id: "local_" + Date.now(),
              ...recordPayload,
            });
            localStorage.setItem("shudu_local_records", JSON.stringify(localList.slice(0, 100)));
          } catch (e) {
            console.error("Local save error:", e);
          }

          // 发送至 Worker API
          try {
            await fetch("/api/records", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(recordPayload),
            });
          } catch (err) {
            console.warn("Sync to cloud worker skipped:", err);
          }
        },

        // 加载历史做题记录 (类似微信小程序时间段展示)
        async loadHistoryRecords() {
          const clientUuid = getClientUuid();
          let records = [];
          let stats = { totalRecords: 0, maxScore: 0, avgScore: 0, totalTimeSpent: 0 };

          // 先从后端读取
          try {
            const res = await fetch(`/api/records?clientUuid=${clientUuid}`);
            if (res.ok) {
              const data = await res.json();
              if (data.success) {
                records = data.records || [];
                stats = data.stats || stats;
              }
            }
          } catch (e) {
            // 后端离线时读取本地
            records = JSON.parse(localStorage.getItem("shudu_local_records") || "[]");
            stats.totalRecords = records.length;
            stats.maxScore = records.reduce((m, r) => Math.max(m, r.score || 0), 0);
            stats.avgScore = records.length
              ? Math.round(records.reduce((s, r) => s + (r.score || 0), 0) / records.length)
              : 0;
            stats.totalTimeSpent = records.reduce((s, r) => s + (r.time_spent || r.timeSpent || 0), 0);
          }

          // 渲染顶部小程序大卡片
          document.getElementById("statTotalCount").textContent = stats.totalRecords || records.length;
          document.getElementById("statMaxScore").textContent = stats.maxScore || 0;
          document.getElementById("statAvgScore").textContent = stats.avgScore || 0;
          const mins = Math.round((stats.totalTimeSpent || 0) / 60);
          document.getElementById("statTotalTime").textContent = mins > 0 ? `${mins}分` : `${stats.totalTimeSpent || 0}秒`;

          // 按时间段智能聚类：今天、昨天、近7天、更早
          const timelineContainer = document.getElementById("recordsTimelineList");
          if (!records || records.length === 0) {
            timelineContainer.innerHTML = `
              <div class="record-empty-state">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <circle cx="12" cy="14" r="3"></circle>
                </svg>
                <p>暂无做题记录</p>
                <p style="font-size: 0.75rem; margin-top: 4px; opacity: 0.7;">完成试卷并交卷后，记录将自动在此呈现</p>
              </div>
            `;
            return;
          }

          const groups = {
            today: { label: "今天", list: [] },
            yesterday: { label: "昨天", list: [] },
            last7days: { label: "近 7 天", list: [] },
            earlier: { label: "更早之前", list: [] },
          };

          const now = new Date();
          const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
          const yesterdayStart = todayStart - 86400000;
          const sevenDaysStart = todayStart - 7 * 86400000;

          records.forEach((rec) => {
            const timeStr = rec.created_at || rec.createdAt || new Date().toISOString();
            const recTime = new Date(timeStr).getTime();

            if (recTime >= todayStart) {
              groups.today.list.push(rec);
            } else if (recTime >= yesterdayStart) {
              groups.yesterday.list.push(rec);
            } else if (recTime >= sevenDaysStart) {
              groups.last7days.list.push(rec);
            } else {
              groups.earlier.list.push(rec);
            }
          });

          let timelineHtml = "";
          Object.values(groups).forEach((g) => {
            if (g.list.length === 0) return;

            let cardsHtml = "";
            g.list.forEach((rec) => {
              const score = rec.score;
              let circleClass = "score-low";
              if (score === 100) circleClass = "score-perfect";
              else if (score >= 90) circleClass = "score-high";
              else if (score >= 60) circleClass = "score-mid";

              const timeSpent = rec.time_spent ?? rec.timeSpent ?? 0;
              const dateObj = new Date(rec.created_at || rec.createdAt);
              const timeDisplay = `${dateObj.getHours().toString().padStart(2, "0")}:${dateObj.getMinutes().toString().padStart(2, "0")}`;

              const diffLabels = {
                starter: "入门级",
                easy: "初级",
                medium: "中级",
                hard: "高级",
                mixed_page: "阶梯递进",
                random: "随机",
              };
              const diffText = diffLabels[rec.difficulty] || "初级";
              const totalP = rec.total_puzzles ?? rec.totalPuzzles ?? 12;

              cardsHtml += `
                <div class="record-card">
                  <div class="record-left">
                    <div class="score-circle ${circleClass}">
                      ${score}
                    </div>
                    <div class="record-details">
                      <div class="record-title">
                        ${diffText} · ${totalP} 题
                      </div>
                      <div class="record-meta">
                        <span>🕒 ${timeDisplay}</span>
                        <span>⏱️ ${Math.floor(timeSpent / 60)}分${timeSpent % 60}秒</span>
                      </div>
                    </div>
                  </div>
                  <div class="record-actions">
                    <button class="btn-record-action btn-del" onclick="App.deleteRecord('${rec.id}')">
                      删除
                    </button>
                  </div>
                </div>
              `;
            });

            timelineHtml += `
              <div class="timeline-section">
                <div class="timeline-header">${g.label} (${g.list.length})</div>
                ${cardsHtml}
              </div>
            `;
          });

          timelineContainer.innerHTML = timelineHtml;
        },

        async deleteRecord(id) {
          if (!confirm("确定要删除这条做题记录吗？")) return;

          // 本地删除
          try {
            const list = JSON.parse(localStorage.getItem("shudu_local_records") || "[]");
            const filtered = list.filter((r) => r.id !== id);
            localStorage.setItem("shudu_local_records", JSON.stringify(filtered));
          } catch (e) {}

          // 远程删除
          try {
            await fetch(`/api/records/${id}`, { method: "DELETE" });
          } catch (e) {}

          this.loadHistoryRecords();
        },

        escapeHtml(str) {
          return (str || "").replace(/[&<>"']/g, function (m) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[m];
          });
        },
      };

      // 暴露给 window 以供行内点击
      window.App = App;

      window.addEventListener("DOMContentLoaded", () => {
        App.init();
      });
    </script>
  </body>
</html>
